<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abdulqader Alshawea Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: sticky bar, hero with live coast illustration, tabbed simulators, experience timeline, project cards, stack grid, contact.
   Palette: deep sea ink, Red Sea teal, desert sand; status colors kept separate from the accents. */
:root{
  --bg:#0a1519; --surface:#0f1f25; --surface2:#142a31; --line:#254651;
  --fg:#e8f1f0; --muted:#97adb3; --sea:#3fb6c9; --sand:#f0b955;
  --ok:#4fd18b; --warn:#f0b955; --crit:#ff6b5e;
  --land:#10262d; --water:#0c3140; --road:#2a4b56; --bld:#173740; --ink-on-accent:#06161b;
  --font-display:'Sora','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f3f6f5; --surface:#ffffff; --surface2:#e8f0f0; --line:#c6d6d8;
    --fg:#0d2228; --muted:#4f666c; --sea:#0b7488; --sand:#a8680a;
    --ok:#157a49; --warn:#a8680a; --crit:#c2362a;
    --land:#e5ece6; --water:#cde5ea; --road:#b9ccce; --bld:#d6e2e0; --ink-on-accent:#ffffff;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f6f5; --surface:#ffffff; --surface2:#e8f0f0; --line:#c6d6d8;
  --fg:#0d2228; --muted:#4f666c; --sea:#0b7488; --sand:#a8680a;
  --ok:#157a49; --warn:#a8680a; --crit:#c2362a;
  --land:#e5ece6; --water:#cde5ea; --road:#b9ccce; --bld:#d6e2e0; --ink-on-accent:#ffffff;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0a1519; --surface:#0f1f25; --surface2:#142a31; --line:#254651;
  --fg:#e8f1f0; --muted:#97adb3; --sea:#3fb6c9; --sand:#f0b955;
  --ok:#4fd18b; --warn:#f0b955; --crit:#ff6b5e;
  --land:#10262d; --water:#0c3140; --road:#2a4b56; --bld:#173740; --ink-on-accent:#06161b;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.wrap{max-width:1120px;margin-inline:auto}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:clamp(1.5rem,3.2vw,2.1rem);font-weight:600;letter-spacing:-.01em}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
a{color:var(--sea)}
:focus-visible{outline:2px solid var(--sand);outline-offset:2px;border-radius:4px}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;margin-inline-end:auto;text-decoration:none;color:var(--fg)}
.mono-mark{width:32px;height:32px;border-radius:9px;background:var(--sea);color:var(--ink-on-accent);display:grid;place-items:center;font-size:.9rem;font-weight:700}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;font-size:.92rem}
nav a:hover{color:var(--fg);background:var(--surface2)}
.tools{display:flex;gap:6px}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 11px;display:flex;align-items:center;gap:6px;font-size:.88rem;min-height:36px}
.tbtn:hover{border-color:var(--sea)}
.tbtn[aria-pressed="true"]{background:var(--sea);color:var(--ink-on-accent);border-color:var(--sea)}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center;padding-block:44px 28px}
.kicker{font-family:var(--font-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--sand);display:flex;align-items:center;gap:8px}
:lang(ar) .kicker{letter-spacing:0;text-transform:none;font-family:var(--font-body)}
.hero h1{font-size:clamp(2.2rem,5.4vw,3.8rem);font-weight:700;letter-spacing:-.025em;margin-block:12px 14px}
.hero h1 em{font-style:normal;color:var(--sea)}
.lede{color:var(--muted);max-width:60ch;font-size:1.06rem}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;font-weight:500;min-height:44px}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--ink-on-accent)}
.btn:hover{border-color:var(--sea)}
.hero-art{border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden;aspect-ratio:5/4}
.hero-art{position:relative;touch-action:pan-y;cursor:grab}.hero-art:active{cursor:grabbing}.hero-art svg{display:block;width:100%;height:100%}.hero-art canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.hint3d{position:absolute;inset-block-end:10px;inset-inline-start:12px;font-size:.74rem;color:var(--muted);background:color-mix(in srgb,var(--bg) 78%,transparent);border:1px solid var(--line);border-radius:999px;padding:3px 10px;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-block:8px 0}
.stat{background:var(--surface);padding:14px 16px}
.stat b{display:block;font-family:var(--font-display);font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:.84rem;line-height:1.35;display:block}

section{padding-block:44px 8px;scroll-margin-top:70px}
.sec-head{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;max-width:70ch}
.sec-head p{color:var(--muted)}

/* simulator shell */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;display:flex;align-items:center;gap:8px;font-weight:500;min-height:42px}
.tab[aria-selected="true"]{background:var(--surface2);border-color:var(--sea);box-shadow:inset 0 -2px 0 var(--sea)}
.sim{margin-bottom:28px;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:14px}
.stage{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;position:relative;min-width:0}
.stage svg.map{display:block;width:100%;height:auto}
.ctl{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ctl h3{display:flex;align-items:center;gap:8px;font-size:1rem}
.note{color:var(--muted);font-size:.86rem}
.row{display:flex;flex-direction:column;gap:6px}
.row label,.lbl{font-size:.86rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.row label output{color:var(--fg);font-family:var(--font-mono);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--sea);min-height:26px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 11px;font-size:.84rem;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.chip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--ink-on-accent)}
.chip.crit[aria-pressed="true"]{background:var(--crit);border-color:var(--crit);color:#fff}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface2);border-radius:10px;padding:9px 11px}
.kpi small{display:block;color:var(--muted);font-size:.76rem;line-height:1.3}
.kpi b{font-family:var(--font-mono);font-size:1.12rem;font-weight:500;font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse;font-size:.84rem}
table.t th,table.t td{text-align:start;padding:5px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t th{color:var(--muted);font-weight:500}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;max-height:150px;overflow:auto;font-size:.84rem}
.log li{display:flex;gap:8px;align-items:flex-start}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}
.pill{font-size:.74rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--warn);border-color:var(--warn)}.pill.crit{color:var(--crit);border-color:var(--crit)}
.badge-demo{position:absolute;inset-block-start:10px;inset-inline-start:10px;font-size:.72rem;background:color-mix(in srgb,var(--bg) 80%,transparent);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);z-index:2}

/* svg map vocabulary */
.sea{fill:var(--water)}.land{fill:var(--land);stroke:var(--line);stroke-width:1}
.road{stroke:var(--road);stroke-width:5;fill:none}.road.th{stroke-width:2}
.bld{fill:var(--bld)}
.tx{fill:var(--muted);font-family:var(--font-mono);font-size:11px}
.txb{fill:var(--fg);font-family:var(--font-body);font-size:12px;font-weight:600}
.route{fill:none;stroke:var(--sea);stroke-width:2;stroke-dasharray:5 6;opacity:.8}
.route.on{stroke:var(--sand);stroke-width:2.6;opacity:1}
.hub{fill:var(--surface2);stroke:var(--sea);stroke-width:2;cursor:pointer}
.hub.on{fill:var(--sea)}
.site{fill:var(--sand)}
.drone{fill:var(--fg)}
.flow{fill:none;stroke-linecap:round;stroke-dasharray:3 10;animation:flowdash 1.4s linear infinite}
@keyframes flowdash{to{stroke-dashoffset:-26}}
.pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.asset{cursor:pointer}
.layer-off{display:none}
.wave{fill:none;stroke:var(--sea);stroke-width:1.5;opacity:.5}

/* sections below */
.tl{display:flex;flex-direction:column;gap:0;border-inline-start:2px solid var(--line);margin-inline-start:8px}
.tl-item{padding:0 0 22px 22px;position:relative}
:lang(ar) .tl-item{padding:0 22px 22px 0}
.tl-item::before{content:"";position:absolute;inset-inline-start:-8px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--sea)}
.tl-item.now::before{background:var(--sea)}
.tl-head{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;justify-content:space-between}
.tl-head b{font-family:var(--font-display);font-weight:600}
.tl-date{font-family:var(--font-mono);font-size:.82rem;color:var(--sand)}
.tl-item p{color:var(--muted);max-width:76ch;margin-top:4px;font-size:.96rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-family:var(--font-mono);font-size:.74rem;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .art{aspect-ratio:16/7;background:var(--surface2);border-bottom:1px solid var(--line)}
.card .art svg{display:block;width:100%;height:100%}
.card .body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card p{color:var(--muted);font-size:.93rem}
.card .links{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding-top:6px}
.live{font-size:.72rem;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:1px 8px;margin-inline-start:8px;font-family:var(--font-body);font-weight:500}
.stack{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.sg{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;min-width:0}
.sg h3{display:flex;align-items:center;gap:8px;font-size:.98rem;margin-bottom:8px;color:var(--sea)}
.sg p{color:var(--muted);font-size:.9rem}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.cbox{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cbox .v{font-family:var(--font-mono);font-size:.92rem;overflow-wrap:anywhere}
.cbox .lbl{justify-content:flex-start;align-items:center;gap:8px}
footer{padding-block:34px 28px;color:var(--muted);font-size:.86rem;border-top:1px solid var(--line);margin-top:44px}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .sim{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:last-child{grid-column:1/-1}
}
@media (max-width:560px){
  nav{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap}
  nav a{white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){
  .flow,.pulse{animation:none}
}
</style>

</head>

<script>
(function(){
'use strict';
var host=document.getElementById('hero3d');
if(!host||!window.THREE)return;
var THREE=window.THREE,reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});}catch(e){return}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
var cv=renderer.domElement;host.appendChild(cv);
var svg=host.querySelector('svg');if(svg)svg.style.visibility='hidden';
var hint=document.createElement('div');hint.className='hint3d';host.appendChild(hint);
function setHint(){hint.textContent=document.documentElement.lang==='ar'?'اسحب للتدوير':'Drag to rotate'}setHint();
new MutationObserver(setHint).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});

var scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,1,.1,100);
camera.position.set(0,11.5,19.5);camera.lookAt(0,.2,0);
scene.add(new THREE.AmbientLight(0xffffff,.62));
var sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(6,12,8);scene.add(sun);
var world=new THREE.Group();scene.add(world);

function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888'}
var mats={};
function mat(key,v,opts){var m=new THREE.MeshLambertMaterial(Object.assign({color:css(v)},opts||{}));mats[key]={m:m,v:v};return m}

/* water with animated vertices */
var wGeo=new THREE.PlaneGeometry(110,110,64,64);wGeo.rotateX(-Math.PI/2);
var wMat=new THREE.MeshPhongMaterial({color:css('--water'),flatShading:true,shininess:60,transparent:true,opacity:.96});mats.water={m:wMat,v:'--water'};
var water=new THREE.Mesh(wGeo,wMat);water.position.y=-.05;world.add(water);
var wBase=wGeo.attributes.position.array.slice();

/* land */
var landM=mat('land','--land');
var land=new THREE.Mesh(new THREE.BoxGeometry(15,.5,8),landM);land.position.set(0,.2,-3.3);world.add(land);
var isle=new THREE.Mesh(new THREE.CylinderGeometry(1.8,2.2,.5,9),landM);isle.position.set(6,.15,3.6);world.add(isle);
var isle2=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.5,.45,8),landM);isle2.position.set(-6.2,.12,3.2);world.add(isle2);

/* city blocks */
var seed=11;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
var bldM=mat('bld','--bld');
var cityG=new THREE.Group();world.add(cityG);
for(var i=0;i<13;i++)for(var j=0;j<5;j++){
  if(rnd()<.18)continue;
  var h=.35+Math.pow(rnd(),1.7)*2.6,w=.6+rnd()*.3,d=.6+rnd()*.3;
  var b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),bldM);
  b.position.set(-6.2+i*1.03,.45+h/2,-6+j*1.18);cityG.add(b);
}
/* hospital */
var hosp=new THREE.Mesh(new THREE.BoxGeometry(1.3,1.9,1.3),new THREE.MeshLambertMaterial({color:0xf1f5f5}));hosp.position.set(-1.8,.45+.95,-1.1);world.add(hosp);
var crossM=mat('cross','--crit');
var c1=new THREE.Mesh(new THREE.BoxGeometry(.7,.16,.05),crossM),c2=new THREE.Mesh(new THREE.BoxGeometry(.16,.7,.05),crossM);
[c1,c2].forEach(function(c){c.position.set(-1.8,1.9,-.43);world.add(c)});
/* roads */
var roadM=mat('road','--road');
var rd=new THREE.Mesh(new THREE.BoxGeometry(15,.02,.22),roadM);rd.position.set(0,.46,-.5);world.add(rd);

/* hubs, sites */
var seaM=mat('sea','--sea',{emissive:new THREE.Color(css('--sea')),emissiveIntensity:.35});
var sandM=mat('sand','--sand',{emissive:new THREE.Color(css('--sand')),emissiveIntensity:.3});
var hubs=[new THREE.Vector3(-5.6,.5,.6),new THREE.Vector3(6,.5,3.6),new THREE.Vector3(-6.2,.5,3.2)];
hubs.forEach(function(p){var r=new THREE.Mesh(new THREE.TorusGeometry(.38,.07,10,28),seaM);r.rotation.x=Math.PI/2;r.position.copy(p);world.add(r)});
var sites=[new THREE.Vector3(-1.8,2.5,-1.1),new THREE.Vector3(2.5,1.4,-2.8),new THREE.Vector3(5.2,.9,-4.6),new THREE.Vector3(.8,1.1,-5.2)];
sites.forEach(function(p,i){if(i===0)return;var c=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,.9,12),sandM);c.position.set(p.x,.45+.45,p.z);world.add(c)});

/* routes + drones */
var routes=[],drones=[];
function addRoute(a,b,lift,off){
  var mid=a.clone().lerp(b,.5);mid.y=Math.max(a.y,b.y)+lift;mid.x+=off;
  var curve=new THREE.QuadraticBezierCurve3(a.clone(),mid,b.clone());
  var line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(48)),new THREE.LineBasicMaterial({color:css('--sea'),transparent:true,opacity:.7}));
  mats['route'+routes.length]={m:line.material,v:'--sea',line:1};
  world.add(line);routes.push(curve);
}
addRoute(hubs[0],sites[0],2.2,0);addRoute(hubs[0],sites[1],2.4,.4);addRoute(hubs[1],sites[2],1.8,-.3);addRoute(hubs[2],sites[3],2.3,.3);addRoute(hubs[1],sites[1],2.2,0);
function makeDrone(){
  var g=new THREE.Group(),bm=new THREE.MeshLambertMaterial({color:css('--fg')});mats['dr'+drones.length]={m:bm,v:'--fg'};
  g.add(new THREE.Mesh(new THREE.BoxGeometry(.3,.1,.3),bm));
  var rotors=[];
  [[.22,.22],[-.22,.22],[.22,-.22],[-.22,-.22]].forEach(function(q){
    var arm=new THREE.Mesh(new THREE.BoxGeometry(.3,.025,.025),bm);arm.position.set(q[0]/2,0,q[1]/2);arm.rotation.y=Math.atan2(-q[1],q[0]);g.add(arm);
    var r=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.012,14),sandM);r.position.set(q[0],.06,q[1]);g.add(r);rotors.push(r)});
  g.userData.rotors=rotors;world.add(g);return g;
}
routes.forEach(function(c,i){drones.push({g:makeDrone(),c:c,t:(i*.21)%1,dir:1,sp:.07+i*.012})});

/* drag to rotate */
var rotY=-.35,rotX=0,vel=0,drag=false,lx=0,ly=0,idle=0;
host.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;ly=e.clientY;try{host.setPointerCapture(e.pointerId)}catch(_){}});
host.addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;rotY+=dx*.008;rotX=Math.max(-.25,Math.min(.35,rotX+dy*.004));idle=0});
function up(){drag=false}
host.addEventListener('pointerup',up);host.addEventListener('pointercancel',up);

function resize(){var w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
resize();if(window.ResizeObserver)new ResizeObserver(resize).observe(host);else window.addEventListener('resize',resize);

function recolor(){
  Object.keys(mats).forEach(function(k){var o=mats[k];o.m.color.set(css(o.v));if(k==='water')o.m.color.lerp(new THREE.Color(css('--sea')),.45);if(o.m.emissive&&!o.line&&(o.v==='--sea'||o.v==='--sand'))o.m.emissive.set(css(o.v))});
}
document.getElementById('btn-theme').addEventListener('click',function(){setTimeout(recolor,30)});
if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener&&window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){setTimeout(recolor,30)});
recolor();

var clock=new THREE.Clock(),visible=true;
if(window.IntersectionObserver)new IntersectionObserver(function(en){visible=en[0].isIntersecting}).observe(host);
function frame(){
  requestAnimationFrame(frame);
  if(!visible||document.hidden)return;
  var dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
  if(!reduced){
    if(!drag){idle+=dt;rotY+=dt*.07}
    var p=wGeo.attributes.position.array;
    for(var i=0;i<p.length;i+=3){p[i+1]=Math.sin(wBase[i]*.9+t*1.1)*.07+Math.cos(wBase[i+2]*1.0+t*.9)*.06}
    wGeo.attributes.position.needsUpdate=true;wGeo.computeVertexNormals();
    drones.forEach(function(d){
      d.t+=d.dir*d.sp*dt;if(d.t>=1){d.t=1;d.dir=-1}else if(d.t<=0){d.t=0;d.dir=1}
      var e=d.t*d.t*(3-2*d.t),pos=d.c.getPoint(e);d.g.position.copy(pos);
      var tg=d.c.getTangent(e).multiplyScalar(d.dir);d.g.rotation.y=Math.atan2(-tg.z,tg.x);
      d.g.userData.rotors.forEach(function(r){r.rotation.y+=dt*40});
    });
  }
  world.rotation.y=rotY;world.rotation.x=rotX;
  renderer.render(scene,camera);
}
frame();
})();
</script>
